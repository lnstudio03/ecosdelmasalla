<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecos del Más Allá - Día de Muertos</title>
    
    <!-- Tipografía mística y clásica estilo gótico/antiguo -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Almendra+SC&family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES DE DISEÑO --- */
        :root {
            --oro-cempasuchil: #FFB703;
            --naranja-profundo: #FB8500;
            --blanco-humo: #EAE2B7;
            --negro-penumbra: #050206;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--negro-penumbra);
            color: var(--blanco-humo);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- FONDO ATMOSFÉRICO RECREADO --- */
        /* Usamos una imagen de altar real y un degradado oscuro encima para simular la penumbra de la foto */
        .fondo-altar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(5, 2, 6, 0.2) 0%, rgba(5, 2, 6, 0.85) 80%),
                url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            z-index: 1;
            filter: saturate(1.1) brightness(0.7);
        }

        /* --- CAPA INTERACTIVA DE NIEBLA Y HUMO --- */
        #canvas-humo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.35;
        }

        /* --- CONTENEDOR DE LA INTERFAZ --- */
        .escena-principal {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 1000px;
            text-align: center;
            padding: 2rem;
        }

        /* --- MARCO INVISIBLE PARA ACOMODAR EL TEXTO EN ARCO --- */
        .contenedor-titulos {
            margin-bottom: 3rem;
            position: relative;
        }

        /* Título Curvo con CSS avanzado (SVG integrado para imitar perfectamente la forma de la imagen) */
        .titulo-curvo-svg {
            width: 100%;
            max-width: 750px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0px 4px 15px rgba(0, 0, 0, 0.9));
        }

        .titulo-texto {
            font-family: 'Almendra SC', serif;
            font-size: 58px;
            fill: var(--blanco-humo);
            letter-spacing: 2px;
        }

        /* Subtítulo arqueado que sigue la silueta inferior */
        .subtitulo-texto {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 13px;
            fill: #D4CDA7;
            letter-spacing: 1.5px;
            word-spacing: 2px;
            opacity: 0.9;
        }

        /* --- ALTAR INTERACTIVO --- */
        .altar-centro {
            background: rgba(13, 7, 18, 0.5);
            border: 1px solid rgba(255, 183, 3, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 3rem 2rem;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: all 0.5s ease;
        }

        .altar-centro:hover {
            border-color: rgba(255, 183, 3, 0.5);
            box-shadow: 0 20px 60px rgba(251, 133, 0, 0.15);
        }

        /* Mensaje poético */
        .leyenda {
            font-size: 1.15rem;
            line-height: 1.8;
            letter-spacing: 1px;
            color: #E2D9C2;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            margin-bottom: 2.5rem;
        }

        /* Botón de Ofrenda con Brillo de Velas */
        .btn-ofrenda {
            background: linear-gradient(135deg, var(--naranja-profundo), var(--oro-cempasuchil));
            color: #050206;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(251, 133, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-ofrenda:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--oro-cempasuchil), 0 0 40px rgba(251, 133, 0, 0.6);
            color: #000;
        }

        /* --- DETALLE MÍSTICO: PÉTALOS FLOTANTES --- */
        .petalo {
            position: absolute;
            background: linear-gradient(to right, var(--oro-cempasuchil), var(--naranja-profundo));
            border-radius: 50% 0 50% 50%;
            pointer-events: none;
            opacity: 0.7;
            animation: caer 8s linear infinite;
        }

        @keyframes caer {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(105vh) translateX(100px) rotate(450deg);
                opacity: 0;
            }
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 600px) {
            .titulo-texto { font-size: 38px; }
            .subtitulo-texto { font-size: 9px; }
            .leyenda { font-size: 0.95rem; }
            .altar-centro { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- Fondo fotográfico inmersivo -->
    <div class="fondo-altar"></div>

    <!-- Humo flotante del copal/incienso -->
    <canvas id="canvas-humo"></canvas>

    <div class="escena-principal">
        
        <!-- ENCABEZADO: Recreación exacta del texto arqueado de tu imagen -->
        <div class="contenedor-titulos">
            <svg class="titulo-curvo-svg" viewBox="0 0 1000 320">
                <defs>
                    <!-- Curva para el título principal -->
                    <path id="curva-titulo" d="M 100 240 Q 500 60 900 240" fill="transparent"/>
                    <!-- Curva paralela para el subtítulo largo -->
                    <path id="curva-subtitulo" d="M 120 270 Q 500 115 880 270" fill="transparent"/>
                </defs>
                
                <!-- Texto Principal -->
                <text class="titulo-texto">
                    <textPath href="#curva-titulo" startOffset="50%" text-anchor="middle">
                        Ecos del mas alla
                    </textPath>
                </text>
                
                <!-- Texto Secundario/Subtítulo descriptivo -->
                <text class="subtitulo-texto">
                    <textPath href="#curva-subtitulo" startOffset="50%" text-anchor="middle">
                        Un viaje por las canciones, las leyendas y las memorias del Día de Muertos.
                    </textPath>
                </text>
            </svg>
        </div>

        <!-- Módulo del Altar / Interfaz de Usuario -->
        <div class="altar-centro">
            <p class="leyenda">
                Cruza el umbral del cempasúchil y enciende el recuerdo.<br>
                Las almas sedientas regresan guiadas por la luz del copal y el cantar de la tierra.
            </p>
            <button class="btn-ofrenda" onclick="invocarPetalos()">Colocar una Ofrenda</button>
        </div>

    </div>

    <!-- JAVASCRIPT: Efectos atmosféricos pro (Humo interactivo y lluvia de cempasúchil) -->
    <script>
        // --- EFECTO 1: SISTEMA DE HUMO/COPAL (Canvas) ---
        const canvas = document.getElementById('canvas-humo');
        const ctx = canvas.getContext('2d');

        function ajustarPantalla() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', ajustarPantalla);
        ajustarPantalla();

        const nubesHumo = [];
        class Humo {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 80 + 60;
                this.vx = Math.random() * 0.4 - 0.2;
                this.vy = -(Math.random() * 0.6 + 0.3);
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < -this.size) {
                    this.y = canvas.height + this.size;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#6D597A'; // Tono humo purpúreo/místico
                ctx.filter = 'blur(40px)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for(let i=0; i<30; i++) { nubesHumo.push(new Humo()); }

nubesHumo.forEach(n => { n.update(); n.draw(); });

}

// --- EFECTO 2: LLUVIA GENERATIVA DE PÉTALOS DE CEMPASÚCHIL ---
function crearPetalo() {
const petalo = document.createElement('div');
petalo.classList.add('petalo');
// Tamaños y posiciones aleatorias
const ancho = Math.random() * 10 + 8;
petalo.style.width = ${ancho}px;
petalo.style.height = ${ancho * 1.4}px;
petalo.style.left = ${Math.random() * 100}vw;
// Variación en la velocidad de caída
petalo.style.animationDuration = ${Math.random() * 5 + 5}s;
document.body.appendChild(petalo);
// Eliminar del documento una vez termine la animación para no saturar memoria
setTimeout(() => { petalo.remove(); }, 10000);
}
// Generación continua automática (Baja densidad para mantener el misterio)
setInterval(crearPetalo, 400);
// Disparador especial al presionar el botón interactivo del altar
function invocarPetalos() {
for(let i=0; i<25; i++) {
setTimeout(crearPetalo, i * 80);
}
}



### ¿Qué mejoras incluye para parecerse a tu imagen?
1. **Curvatura Perfecta del Texto:** Implementé un contenedor **SVG (`<textPath>`)** que obliga al código HTML a moldear las palabras exactamente en el mismo arco curvo y armonioso que muestra tu captura de pantalla, incluyendo el subtítulo descriptivo debajo.
2. **Atmósfera de Iluminación Clásica:** Reemplacé el fondo plano por una imagen base de un altar tradicional envuelto en una penumbra lograda mediante CSS (`radial-gradient` en tonos negros y morados).
3. **Niebla/Copal en Tiempo Real:** El script genera partículas ultra-difuminadas que suben lentamente por la pantalla, simulando el humo del incienso o copal característico de las ofrendas.
